name: APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Proje dosyalarini olustur
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/vnapp"
          cd "$RUNNER_TEMP/vnapp"
          cat > settings.gradle <<'EOF_0'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VN"
          include ':app'
          EOF_0
          cat > build.gradle <<'EOF_1'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_1
          cat > gradle.properties <<'EOF_2'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF_2
          mkdir -p app
          cat > app/build.gradle <<'EOF_3'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.vn.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.vn.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "1.2"
              }

              signingConfigs {
                  debug {
                      storeFile file('../vn.keystore')
                      storePassword 'vnapp123'
                      keyAlias 'vn'
                      keyPassword 'vnapp123'
                  }
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.core:core:1.12.0'
          }
          EOF_3
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <queries>
                  <intent>
                      <action android:name="android.media.action.IMAGE_CAPTURE" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboard|keyboardHidden|smallestScreenSize|screenLayout|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_4
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF_5'
          <resources>
              <string name="app_name">VN</string>
          </resources>
          EOF_5
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/styles.xml <<'EOF_6'
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">@android:color/black</item>
                  <item name="android:navigationBarColor">@android:color/black</item>
              </style>
          </resources>
          EOF_6
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/file_paths.xml <<'EOF_7'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="photos" path="photos/" />
          </paths>
          EOF_7
          mkdir -p app/src/main/java/com/vn/app
          cat > app/src/main/java/com/vn/app/MainActivity.java <<'EOF_8'
          package com.vn.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ClipData;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.core.content.FileProvider;

          import java.io.File;

          public class MainActivity extends Activity {

              // Sitenin adresi. Degisirse sadece burayi guncelle.
              private static final String SITE_URL = "https://vn-virnet-com.github.io/virnet/";
              private static final String SITE_HOST = "vn-virnet-com.github.io";

              private WebView webView;
              private ValueCallback<Uri[]> fileCallback;
              private Uri cameraUri;
              private PermissionRequest pendingPerm;

              private static final int FILE_REQ = 1;
              private static final int CAMERA_REQ = 3;
              private static final int PERM_REQ = 2;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // Varsayilan: ekran goruntusu ve ekran kaydi KAPALI (son uygulamalarda onizleme siyah)
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE,
                          WindowManager.LayoutParams.FLAG_SECURE);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String host = uri.getHost();
                          if (host != null && host.equals(SITE_HOST)) {
                              return false;
                          }
                          // Baska siteler (ornegin YouTube linkleri) tarayicida acilsin
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, uri));
                          } catch (Exception ignored) { }
                          return true;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> handleWebPermission(request));
                      }

                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback,
                                                       FileChooserParams params) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = callback;

                          // <input capture>: dogrudan kamera uygulamasini ac
                          if (params.isCaptureEnabled() && wantsImage(params)) {
                              if (launchCamera()) return true;
                          }
                          try {
                              startActivityForResult(params.createIntent(), FILE_REQ);
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void setSecure(final boolean secure) {
                          runOnUiThread(() -> {
                              if (secure) {
                                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_SECURE);
                              } else {
                                  getWindow().clearFlags(WindowManager.LayoutParams.FLAG_SECURE);
                              }
                          });
                      }
                  }, "VNApp");

                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      webView.loadUrl(SITE_URL);
                  }
              }

              private boolean wantsImage(WebChromeClient.FileChooserParams params) {
                  String[] types = params.getAcceptTypes();
                  if (types == null) return false;
                  for (String t : types) {
                      if (t != null && t.startsWith("image")) return true;
                  }
                  return false;
              }

              private boolean launchCamera() {
                  try {
                      File dir = new File(getCacheDir(), "photos");
                      if (!dir.exists()) dir.mkdirs();
                      File f = File.createTempFile("vn_", ".jpg", dir);
                      cameraUri = FileProvider.getUriForFile(this, getPackageName() + ".fileprovider", f);

                      Intent i = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                      i.putExtra(MediaStore.EXTRA_OUTPUT, cameraUri);
                      i.setClipData(ClipData.newRawUri("", cameraUri));
                      i.addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION | Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      startActivityForResult(i, CAMERA_REQ);
                      return true;
                  } catch (Exception e) {
                      cameraUri = null;
                      return false;
                  }
              }

              // Sitenin mikrofon istegi (sesli mesaj): once Android iznini iste, sonra siteye ver
              private void handleWebPermission(PermissionRequest request) {
                  boolean wantsAudio = false;
                  for (String r : request.getResources()) {
                      if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(r)) wantsAudio = true;
                  }
                  if (!wantsAudio) {
                      request.deny();
                      return;
                  }
                  if (Build.VERSION.SDK_INT >= 23
                          && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      if (pendingPerm != null) pendingPerm.deny();
                      pendingPerm = request;
                      requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, PERM_REQ);
                  } else {
                      request.grant(new String[]{PermissionRequest.RESOURCE_AUDIO_CAPTURE});
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == PERM_REQ && pendingPerm != null) {
                      boolean ok = grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED;
                      if (ok) {
                          pendingPerm.grant(new String[]{PermissionRequest.RESOURCE_AUDIO_CAPTURE});
                      } else {
                          pendingPerm.deny();
                      }
                      pendingPerm = null;
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == CAMERA_REQ && fileCallback != null) {
                      Uri[] result = null;
                      if (resultCode == RESULT_OK && cameraUri != null) {
                          result = new Uri[]{cameraUri};
                      }
                      fileCallback.onReceiveValue(result);
                      fileCallback = null;
                      return;
                  }
                  if (requestCode == FILE_REQ && fileCallback != null) {
                      Uri[] result = null;
                      if (resultCode == RESULT_OK && data != null) {
                          result = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                      }
                      fileCallback.onReceiveValue(result);
                      fileCallback = null;
                      return;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  webView.saveState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  CookieManager.getInstance().flush();
              }
          }
          EOF_8
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          echo "" | base64 -d > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          echo "" | base64 -d > vn.keystore

      - name: APK derle
        run: |
          cd "$RUNNER_TEMP/vnapp"
          gradle assembleDebug --no-daemon

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: VN-apk
          path: ${{ runner.temp }}/vnapp/app/build/outputs/apk/debug/app-debug.apk
