          mkdir -p app/src/main/res/mipmap-xxxhdpi
          echo "" | base64 -d > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          echo "" | base64 -d > vn.keystore

      - name: APK derle
        run: |
          cd "$RUNNER_TEMP/vnapp"
          # Her derlemede surum numarasi otomatik artar (eski kurulu 3'ten buyuk olsun diye +100)
          VC=$((GITHUB_RUN_NUMBER + 100))
          echo "VC=$VC" >> "$GITHUB_ENV"
          # Guncelleme kontrolu icin bu deponun adini koda yaz
          sed -i "s#__REPO__#${{ github.repository }}#" app/src/main/java/com/vn/app/MainActivity.java
          gradle assembleDebug --no-daemon -Pvc=$VC -Pvn=1.$VC

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: VN-apk
          path: ${{ runner.temp }}/vnapp/app/build/outputs/apk/debug/app-debug.apk

      - name: Guncelleme yayini olustur
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          cp "$RUNNER_TEMP/vnapp/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/VN.apk"
          if [ -z "$NOTES" ]; then NOTES="Uygulamanin yeni surumu hazir."; fi
          # Ayni numarali yayin zaten varsa (Re-run), once sil
          gh release delete "v$VC" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$VC" "$RUNNER_TEMP/VN.apk" --repo "${{ github.repository }}" --title "Surum $VC" --notes "$NOTES" --latest
