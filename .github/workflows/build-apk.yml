name: APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Proje dosyalarini olustur
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/vnapp"
          cd "$RUNNER_TEMP/vnapp"
          cat > settings.gradle <<'EOF_0'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VN"
          include ':app'
          EOF_0
          cat > build.gradle <<'EOF_1'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_1
          cat > gradle.properties <<'EOF_2'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF_2
          mkdir -p app
          cat > app/build.gradle <<'EOF_3'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.vn.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.vn.app"
                  minSdk 24
                  targetSdk 34
                  versionCode = ((project.findProperty('vc') ?: '3') as String).toInteger()
                  versionName = ((project.findProperty('vn') ?: '1.2') as String)
              }

              signingConfigs {
                  debug {
                      storeFile file('../vn.keystore')
                      storePassword 'vnapp123'
                      keyAlias 'vn'
                      keyPassword 'vnapp123'
                  }
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.core:core:1.12.0'
          }
          EOF_3
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />

              <queries>
                  <intent>
                      <action android:name="android.media.action.IMAGE_CAPTURE" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboard|keyboardHidden|smallestScreenSize|screenLayout|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_4
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF_5'
          <resources>
              <string name="app_name">VN</string>
          </resources>
          EOF_5
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/styles.xml <<'EOF_6'
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">@android:color/black</item>
                  <item name="android:navigationBarColor">@android:color/black</item>
              </style>
          </resources>
          EOF_6
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/file_paths.xml <<'EOF_7'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="photos" path="photos/" />
              <cache-path name="updates" path="updates/" />
          </paths>
          EOF_7
          mkdir -p app/src/main/java/com/vn/app
          cat > app/src/main/java/com/vn/app/MainActivity.java <<'EOF_8'
          package com.vn.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ClipData;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.graphics.Color;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.app.AlertDialog;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.widget.Toast;
          import android.app.Dialog;
          import android.graphics.Typeface;
          import android.graphics.drawable.ColorDrawable;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.widget.ScrollView;

          import androidx.core.content.FileProvider;

          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class MainActivity extends Activity {

              // Sitenin adresi. Degisirse sadece burayi guncelle.
              private static final String SITE_URL = "https://vn-virnet-com.github.io/virnet/";
              private static final String SITE_HOST = "vn-virnet-com.github.io";

              private WebView webView;
              private ValueCallback<Uri[]> fileCallback;
              private Uri cameraUri;
              private PermissionRequest pendingPerm;

              private static final int FILE_REQ = 1;
              private static final int CAMERA_REQ = 3;
              private static final int PERM_REQ = 2;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // Varsayilan: ekran goruntusu ve ekran kaydi KAPALI (son uygulamalarda onizleme siyah)
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE,
                          WindowManager.LayoutParams.FLAG_SECURE);

                  webView = new WebView(this);
                  setContentView(webView);
                  webView.setVisibility(View.INVISIBLE); // guncelleme kontrolu bitene kadar site gizli

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String host = uri.getHost();
                          if (host != null && host.equals(SITE_HOST)) {
                              return false;
                          }
                          // Baska siteler (ornegin YouTube linkleri) tarayicida acilsin
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, uri));
                          } catch (Exception ignored) { }
                          return true;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> handleWebPermission(request));
                      }

                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback,
                                                       FileChooserParams params) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = callback;

                          // <input capture>: dogrudan kamera uygulamasini ac
                          if (params.isCaptureEnabled() && wantsImage(params)) {
                              if (launchCamera()) return true;
                          }
                          try {
                              startActivityForResult(params.createIntent(), FILE_REQ);
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void setSecure(final boolean secure) {
                          runOnUiThread(() -> {
                              if (secure) {
                                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_SECURE);
                              } else {
                                  getWindow().clearFlags(WindowManager.LayoutParams.FLAG_SECURE);
                              }
                          });
                      }

                      @JavascriptInterface
                      public void setBarColor(final String hex) {
                          runOnUiThread(() -> {
                              try {
                                  int c = Color.parseColor(hex);
                                  themeBg = c | 0xFF000000;
                                  getWindow().setStatusBarColor(c);
                                  getWindow().setNavigationBarColor(c);
                              } catch (Exception ignored) { }
                          });
                      }
                  }, "VNApp");

                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      webView.loadUrl(SITE_URL);
                  }

                  checkForUpdate();
              }

              private boolean wantsImage(WebChromeClient.FileChooserParams params) {
                  String[] types = params.getAcceptTypes();
                  if (types == null) return false;
                  for (String t : types) {
                      if (t != null && t.startsWith("image")) return true;
                  }
                  return false;
              }

              private boolean launchCamera() {
                  try {
                      File dir = new File(getCacheDir(), "photos");
                      if (!dir.exists()) dir.mkdirs();
                      File f = File.createTempFile("vn_", ".jpg", dir);
                      cameraUri = FileProvider.getUriForFile(this, getPackageName() + ".fileprovider", f);

                      Intent i = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                      i.putExtra(MediaStore.EXTRA_OUTPUT, cameraUri);
                      i.setClipData(ClipData.newRawUri("", cameraUri));
                      i.addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION | Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      startActivityForResult(i, CAMERA_REQ);
                      return true;
                  } catch (Exception e) {
                      cameraUri = null;
                      return false;
                  }
              }

              // Sitenin mikrofon istegi (sesli mesaj): once Android iznini iste, sonra siteye ver
              private void handleWebPermission(PermissionRequest request) {
                  boolean wantsAudio = false;
                  for (String r : request.getResources()) {
                      if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(r)) wantsAudio = true;
                  }
                  if (!wantsAudio) {
                      request.deny();
                      return;
                  }
                  if (Build.VERSION.SDK_INT >= 23
                          && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      if (pendingPerm != null) pendingPerm.deny();
                      pendingPerm = request;
                      requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, PERM_REQ);
                  } else {
                      request.grant(new String[]{PermissionRequest.RESOURCE_AUDIO_CAPTURE});
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == PERM_REQ && pendingPerm != null) {
                      boolean ok = grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED;
                      if (ok) {
                          pendingPerm.grant(new String[]{PermissionRequest.RESOURCE_AUDIO_CAPTURE});
                      } else {
                          pendingPerm.deny();
                      }
                      pendingPerm = null;
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == CAMERA_REQ && fileCallback != null) {
                      Uri[] result = null;
                      if (resultCode == RESULT_OK && cameraUri != null) {
                          result = new Uri[]{cameraUri};
                      }
                      fileCallback.onReceiveValue(result);
                      fileCallback = null;
                      return;
                  }
                  if (requestCode == FILE_REQ && fileCallback != null) {
                      Uri[] result = null;
                      if (resultCode == RESULT_OK && data != null) {
                          result = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                      }
                      fileCallback.onReceiveValue(result);
                      fileCallback = null;
                      return;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  webView.saveState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              // ===================== OTOMATIK GUNCELLEME =====================
              // __REPO__ derleme sirasinda otomatik olarak bu GitHub deposunun adiyla degisir.
              private static final String UPDATE_REPO = "__REPO__";
              private static final int MP = ViewGroup.LayoutParams.MATCH_PARENT;
              private static final int WC = ViewGroup.LayoutParams.WRAP_CONTENT;

              private File pendingApk;
              private Dialog updDialog;
              private LinearLayout updBox;
              private TextView updPct;
              private View updFillV;
              private View updRestV;
              private boolean downloading = false;
              private boolean updateShown = false;
              private int themeBg = 0xFF000000; // sitenin tema rengi (setBarColor ile gelir)

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              private int mix(int c, int with, float t) {
                  int r = (int) (Color.red(c) * (1 - t) + Color.red(with) * t);
                  int g = (int) (Color.green(c) * (1 - t) + Color.green(with) * t);
                  int b = (int) (Color.blue(c) * (1 - t) + Color.blue(with) * t);
                  return Color.rgb(r, g, b);
              }

              private GradientDrawable round(int color, int radiusDp) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(radiusDp));
                  return g;
              }

              private LinearLayout.LayoutParams lp(int w, int h, int topDp) {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(w, h);
                  p.topMargin = dp(topDp);
                  return p;
              }

              private TextView label(String text, int sp, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(text);
                  t.setTextSize(sp);
                  t.setTextColor(color);
                  t.setGravity(Gravity.CENTER);
                  if (bold) t.setTypeface(Typeface.DEFAULT_BOLD);
                  return t;
              }

              private TextView button(String text, boolean primary, View.OnClickListener l) {
                  TextView b = label(text, 15, primary ? 0xFF000000 : 0xFF9B9B9B, primary);
                  if (primary) b.setBackground(round(0xFFFFFFFF, 14));
                  b.setOnClickListener(l);
                  return b;
              }

              private View iconCircle(String glyph) {
                  TextView t = label(glyph, 26, 0xFF000000, true);
                  t.setBackground(round(0xFFFFFFFF, 28));
                  t.setLayoutParams(new LinearLayout.LayoutParams(dp(56), dp(56)));
                  return t;
              }

              // Tema renginde, yuvarlak koseli kart seklinde bir pencere olusturur
              private Dialog openCard() {
                  if (updDialog != null) {
                      try { updDialog.dismiss(); } catch (Exception ignored) { }
                  }
                  updBox = new LinearLayout(this);
                  updBox.setOrientation(LinearLayout.VERTICAL);
                  updBox.setGravity(Gravity.CENTER_HORIZONTAL);
                  updBox.setPadding(dp(24), dp(28), dp(24), dp(24));
                  GradientDrawable bg = round(mix(themeBg, 0xFFFFFFFF, 0.08f), 26);
                  bg.setStroke(dp(1), mix(themeBg, 0xFFFFFFFF, 0.16f));
                  updBox.setBackground(bg);

                  Dialog d = new Dialog(this);
                  d.requestWindowFeature(Window.FEATURE_NO_TITLE);
                  d.setContentView(updBox);
                  Window w = d.getWindow();
                  if (w != null) {
                      w.setBackgroundDrawable(new ColorDrawable(Color.TRANSPARENT));
                      w.addFlags(WindowManager.LayoutParams.FLAG_DIM_BEHIND);
                      w.setDimAmount(0.65f);
                      int width = Math.min(getResources().getDisplayMetrics().widthPixels - dp(48), dp(380));
                      w.setLayout(width, WC);
                  }
                  updDialog = d;
                  return d;
              }

              private int installedCode() {
                  try {
                      android.content.pm.PackageInfo p = getPackageManager().getPackageInfo(getPackageName(), 0);
                      return (int) (Build.VERSION.SDK_INT >= 28 ? p.getLongVersionCode() : p.versionCode);
                  } catch (Exception e) {
                      return 0;
                  }
              }

              private String[] fetchUpdate() throws Exception {
                  URL u = new URL("https://api.github.com/repos/" + UPDATE_REPO + "/releases/latest");
                  HttpURLConnection c = (HttpURLConnection) u.openConnection();
                  c.setConnectTimeout(6000);
                  c.setReadTimeout(6000);
                  c.setRequestProperty("Accept", "application/vnd.github+json");
                  c.setRequestProperty("User-Agent", "VN-App");
                  if (c.getResponseCode() != 200) return null;
                  BufferedReader r = new BufferedReader(new InputStreamReader(c.getInputStream(), "UTF-8"));
                  StringBuilder sb = new StringBuilder();
                  String line;
                  while ((line = r.readLine()) != null) sb.append(line);
                  r.close();

                  JSONObject j = new JSONObject(sb.toString());
                  int remote = Integer.parseInt(j.optString("tag_name", "").replaceAll("[^0-9]", ""));
                  if (remote <= installedCode()) return null;

                  String apkUrl = null;
                  JSONArray assets = j.optJSONArray("assets");
                  if (assets != null) {
                      for (int i = 0; i < assets.length(); i++) {
                          JSONObject a = assets.getJSONObject(i);
                          if (a.optString("name").endsWith(".apk")) {
                              apkUrl = a.optString("browser_download_url");
                              break;
                          }
                      }
                  }
                  if (apkUrl == null) return null;
                  return new String[]{"1." + remote, j.optString("body", ""), apkUrl};
              }

              // Site, guncelleme kontrolu bitene kadar gizli kalir; guncelleme yoksa (veya kontrol edilemediyse) acilir
              private void allowEntry() {
                  if (webView != null) webView.setVisibility(View.VISIBLE);
              }

              private void checkForUpdate() {
                  new Thread(() -> {
                      String[] r = null;
                      try {
                          r = fetchUpdate();
                      } catch (Exception ignored) { }
                      final String[] res = r;
                      runOnUiThread(() -> {
                          if (res == null) allowEntry();
                          else showUpdateDialog(res[0], res[1], res[2]);
                      });
                  }).start();
              }

              // GitHub'in otomatik commit mesajlarini ("Update x", "Add files via upload"...) gosterme
              private String cleanNotes(String s) {
                  if (s == null) return null;
                  s = s.trim();
                  if (s.isEmpty() || s.startsWith("Uygulamanin yeni")) return null;
                  if (s.length() < 80 && s.matches("(?s)(Update|Create|Delete|Add|Upload|Merge|Rename|Revert)\\b.*")) return null;
                  return s;
              }

              private void showUpdateDialog(String version, String notes, final String url) {
                  if (isFinishing() || updateShown) return;
                  updateShown = true;
                  if (webView != null) webView.setVisibility(View.INVISIBLE);
                  Dialog d = openCard();
                  renderOffer(version, notes, url);
                  d.setCancelable(false);
                  d.setCanceledOnTouchOutside(false);
                  d.show();
                  updBox.setAlpha(0f);
                  updBox.setScaleX(0.93f);
                  updBox.setScaleY(0.93f);
                  updBox.animate().alpha(1f).scaleX(1f).scaleY(1f).setDuration(200).start();
              }

              private void renderOffer(String version, String notes, final String url) {
                  LinearLayout b = updBox;
                  b.removeAllViews();
                  b.addView(iconCircle("\u2193"));
                  b.addView(label("G\u00fcncelleme gerekli", 20, 0xFFFFFFFF, true), lp(MP, WC, 18));
                  b.addView(label("S\u00fcr\u00fcm " + version, 13, 0xFF9B9B9B, false), lp(MP, WC, 4));
                  b.addView(label("Devam etmek i\u00e7in uygulamay\u0131 g\u00fcncellemelisin.", 14, 0xFFCFCFCF, false), lp(MP, WC, 12));

                  String n = cleanNotes(notes);
                  if (n != null) {
                      TextView nt = label(n, 14, 0xFFCFCFCF, false);
                      nt.setGravity(Gravity.START);
                      nt.setLineSpacing(0, 1.15f);
                      nt.setPadding(dp(14), dp(12), dp(14), dp(12));
                      ScrollView sv = new ScrollView(this) {
                          @Override
                          protected void onMeasure(int w, int h) {
                              super.onMeasure(w, View.MeasureSpec.makeMeasureSpec(dp(150), View.MeasureSpec.AT_MOST));
                          }
                      };
                      sv.setOverScrollMode(View.OVER_SCROLL_NEVER);
                      sv.setBackground(round(0x14FFFFFF, 14));
                      sv.addView(nt);
                      b.addView(sv, lp(MP, WC, 16));
                  }

                  b.addView(button("G\u00fcncelle", true, v -> startDownload(url)), lp(MP, dp(50), 22));
              }

              private void renderReady(final File apk) {
                  if (updDialog == null) return;
                  updDialog.setCancelable(false);
                  LinearLayout b = updBox;
                  b.removeAllViews();
                  b.addView(iconCircle("\u2713"));
                  b.addView(label("G\u00fcncelleme indirildi", 20, 0xFFFFFFFF, true), lp(MP, WC, 18));
                  b.addView(label("Kurulumu tamamlamak i\u00e7in Y\u00fckle'ye bas.", 14, 0xFF9B9B9B, false), lp(MP, WC, 6));
                  b.addView(button("Y\u00fckle", true, v -> installApk(apk)), lp(MP, dp(50), 22));
              }

              private void setProgress(int pct) {
                  if (updPct == null || updFillV == null || updRestV == null) return;
                  updPct.setText("%" + pct);
                  ((LinearLayout.LayoutParams) updFillV.getLayoutParams()).weight = pct;
                  ((LinearLayout.LayoutParams) updRestV.getLayoutParams()).weight = 100 - pct;
                  updFillV.requestLayout();
                  updRestV.requestLayout();
              }

              private void renderError(final String url) {
                  downloading = false;
                  if (updDialog == null) return;
                  updDialog.setCancelable(false);
                  LinearLayout b = updBox;
                  b.removeAllViews();
                  b.addView(iconCircle("!"));
                  b.addView(label("\u0130ndirilemedi", 20, 0xFFFFFFFF, true), lp(MP, WC, 18));
                  b.addView(label("\u0130nternet ba\u011flant\u0131n\u0131 kontrol edip tekrar dene.", 14, 0xFF9B9B9B, false), lp(MP, WC, 6));
                  b.addView(button("Tekrar dene", true, v -> startDownload(url)), lp(MP, dp(50), 22));
              }

              private void startDownload(final String url) {
                  if (downloading || updDialog == null) return;
                  downloading = true;
                  updDialog.setCancelable(false);

                  LinearLayout b = updBox;
                  b.removeAllViews();
                  b.addView(iconCircle("\u2193"));
                  b.addView(label("\u0130ndiriliyor", 20, 0xFFFFFFFF, true), lp(MP, WC, 18));
                  updPct = label("%0", 34, 0xFFFFFFFF, true);
                  b.addView(updPct, lp(MP, WC, 8));

                  LinearLayout track = new LinearLayout(this);
                  track.setOrientation(LinearLayout.HORIZONTAL);
                  track.setBackground(round(0x26FFFFFF, 4));
                  updFillV = new View(this);
                  updFillV.setBackground(round(0xFFFFFFFF, 4));
                  updRestV = new View(this);
                  track.addView(updFillV, new LinearLayout.LayoutParams(0, MP, 0f));
                  track.addView(updRestV, new LinearLayout.LayoutParams(0, MP, 100f));
                  b.addView(track, lp(MP, dp(8), 14));

                  b.addView(label("L\u00fctfen uygulamay\u0131 kapatma", 13, 0xFF9B9B9B, false), lp(MP, WC, 16));

                  new Thread(() -> {
                      try {
                          File dir = new File(getCacheDir(), "updates");
                          if (!dir.exists()) dir.mkdirs();
                          final File out = new File(dir, "VN.apk");
                          if (out.exists()) out.delete();

                          HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                          c.setConnectTimeout(15000);
                          c.setReadTimeout(30000);
                          c.setRequestProperty("User-Agent", "VN-App");
                          int total = c.getContentLength();
                          InputStream in = c.getInputStream();
                          FileOutputStream fo = new FileOutputStream(out);
                          byte[] buf = new byte[16384];
                          long done = 0;
                          int n, lastPct = -1;
                          while ((n = in.read(buf)) > 0) {
                              fo.write(buf, 0, n);
                              done += n;
                              if (total > 0) {
                                  final int pct = (int) (done * 100 / total);
                                  if (pct != lastPct) {
                                      lastPct = pct;
                                      runOnUiThread(() -> setProgress(pct));
                                  }
                              }
                          }
                          fo.close();
                          in.close();

                          runOnUiThread(() -> {
                              downloading = false;
                              renderReady(out);
                              installApk(out);
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> renderError(url));
                      }
                  }).start();
              }

              private void installApk(File apk) {
                  if (Build.VERSION.SDK_INT >= 26 && !getPackageManager().canRequestPackageInstalls()) {
                      // Ilk seferde Android "bu uygulamaya yukleme izni ver" ekranini acar
                      pendingApk = apk;
                      Toast.makeText(this, "G\u00fcncellemeyi y\u00fcklemek i\u00e7in bu uygulamaya izin ver, sonra geri d\u00f6n.", Toast.LENGTH_LONG).show();
                      startActivity(new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                              Uri.parse("package:" + getPackageName())));
                      return;
                  }
                  try {
                      Uri uri = FileProvider.getUriForFile(this, getPackageName() + ".fileprovider", apk);
                      Intent i = new Intent(Intent.ACTION_VIEW);
                      i.setDataAndType(uri, "application/vnd.android.package-archive");
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                  } catch (Exception e) {
                      Toast.makeText(this, "G\u00fcncelleme ba\u015flat\u0131lamad\u0131.", Toast.LENGTH_LONG).show();
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (pendingApk != null && Build.VERSION.SDK_INT >= 26 && getPackageManager().canRequestPackageInstalls()) {
                      File f = pendingApk;
                      pendingApk = null;
                      installApk(f);
                  }
              }
              // =================== OTOMATIK GUNCELLEME SONU ===================

              @Override
              protected void onPause() {
                  super.onPause();
                  CookieManager.getInstance().flush();
              }
          }
